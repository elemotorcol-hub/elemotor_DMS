

services:
  mysql:
    image: mysql:8.0
    container_name: elemotor_mysql
    command: --default-authentication-plugin=mysql_native_password
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: trust
      MYSQL_DATABASE: db_elemotor
      MYSQL_USER: elemotor_user
      MYSQL_PASSWORD: trust
    ports:
      - '3307:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
    driver: local
